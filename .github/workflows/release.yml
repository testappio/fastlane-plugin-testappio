name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Publish to RubyGems
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Build gem
        run: gem build fastlane-plugin-testappio.gemspec
      - name: Configure RubyGems credentials (OIDC trusted publishing)
        uses: rubygems/configure-rubygems-credentials@v2.1.0
      - name: Push to RubyGems
        run: gem push fastlane-plugin-testappio-*.gem
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: fastlane-plugin-testappio-*.gem
          generate_release_notes: true
