name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Publish to RubyGems
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Build gem
        run: gem build fastlane-plugin-testappio.gemspec
      - name: Push to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          if [ -z "$GEM_HOST_API_KEY" ]; then
            echo "RUBYGEMS_API_KEY not set; configure OIDC trusted publishing or add the secret." >&2
            exit 1
          fi
          gem push fastlane-plugin-testappio-*.gem
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: fastlane-plugin-testappio-*.gem
          generate_release_notes: true
